name: flutter_cors_bypass
description: >-
  Local development CORS proxy for Flutter Web. Run it on localhost and route
  API calls through it so the browser stops blocking them. Not for deployment.
version: 1.0.1
homepage: https://github.com/gikwegbu/flutter_cors_bypass
repository: https://github.com/gikwegbu/flutter_cors_bypass
issue_tracker: https://github.com/gikwegbu/flutter_cors_bypass/issues
license: MIT

environment:
  sdk: ^3.12.0

executables:
  flutter_cors_bypass: flutter_cors_bypass

dependencies:
  http: ^1.6.0
  path: ^1.9.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3

dev_dependencies:
  coverage: ^1.15.1
  crypto: ^3.0.7
  lints: ^6.0.0
  test: ^1.25.6
